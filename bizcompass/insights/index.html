<!doctype html>
<html lang="ko">
  <head>
    <!--@head title="인사이트" description="창업과 사업 운영에 도움이 되는 내용을 카드뉴스로 전해 드립니다."-->
  </head>
  <body data-page="insights">
    <!--@header active="insights"-->
    <main id="main">
      <section class="page-hero">
        <div class="wrap page-hero-split">
          <div>
            <p class="eyebrow">인사이트</p>
            <h1>창업에 필요한 이야기를<br /><span class="hl">카드뉴스</span>로 만나보세요</h1>
            <p class="page-hero-lead">창업 준비부터 사업 운영까지, 알아 두면 좋은 내용을 넘겨 보기 쉽게 정리했습니다.</p>
          </div>
          <div class="count-badge" aria-live="polite">
            <strong id="insight-count">0</strong>
            <span>편</span>
          </div>
        </div>
      </section>

      <section class="section section--flush">
        <div class="wrap">
          <div class="chips" id="insight-tabs" role="group" aria-label="인사이트 분류" hidden></div>
          <div class="insight-grid" id="insight-grid"></div>
          <div class="empty" id="insight-empty" hidden>
            <h3>첫 인사이트를 준비하고 있어요</h3>
            <p>곧 카드뉴스로 찾아뵙겠습니다.</p>
          </div>
        </div>
      </section>
    </main>
    <!--@footer-->
    <script type="module" src="/src/pages/insights.js"></script>
  </body>
</html>
