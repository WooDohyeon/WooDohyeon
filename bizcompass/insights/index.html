<!doctype html>
<html lang="ko">
  <head>
    <!--@head title="인사이트" description="창업과 사업 운영에 도움이 되는 내용을 카드뉴스와 아티클로 전해 드립니다."-->
  </head>
  <body data-page="insights">
    <!--@header active="insights"-->
    <main id="main">
      <section class="page-hero">
        <div class="wrap">
          <p class="eyebrow">인사이트</p>
          <h1>창업에 필요한 이야기를<br /><span class="hl">카드뉴스</span>와 글로 만나보세요</h1>
          <p class="page-hero-lead">창업 준비부터 사업 운영까지, 알아 두면 좋은 내용을 넘겨 보는 카드뉴스와 자세히 읽는 아티클로 정리했습니다.</p>
          <nav class="chips insight-jump" aria-label="인사이트 구분">
            <a class="chip" href="#cardnews">카드뉴스 <span id="insight-count">0</span></a>
            <a class="chip" href="#articles">아티클 <span id="article-count">0</span></a>
          </nav>
        </div>
      </section>

      <!-- ① 카드뉴스 -->
      <section class="section section--flush" id="cardnews" aria-labelledby="cardnews-title">
        <div class="wrap">
          <div class="section-head">
            <div>
              <p class="eyebrow">카드뉴스</p>
              <h2 id="cardnews-title">한 장씩 넘겨 보는 인사이트</h2>
            </div>
            <p>핵심만 추려 이미지로 정리했습니다. 카드를 누르면 넘겨 볼 수 있어요.</p>
          </div>
          <div class="chips" id="insight-tabs" role="group" aria-label="카드뉴스 분류" hidden></div>
          <div class="insight-grid" id="insight-grid"></div>
          <div class="empty" id="insight-empty" hidden>
            <h3>첫 카드뉴스를 준비하고 있어요</h3>
            <p>곧 찾아뵙겠습니다.</p>
          </div>
        </div>
      </section>

      <!-- ② 아티클 -->
      <section class="section" id="articles" aria-labelledby="articles-title">
        <div class="wrap">
          <div class="section-head">
            <div>
              <p class="eyebrow">아티클</p>
              <h2 id="articles-title">자세히 읽는 인사이트</h2>
            </div>
            <p>한 가지 주제를 글로 깊이 있게 풀어 드립니다.</p>
          </div>
          <div class="chips" id="article-tabs" role="group" aria-label="아티클 분류" hidden></div>
          <ul class="article-list" id="article-list"></ul>
          <div class="empty" id="article-empty" hidden>
            <h3>첫 아티클을 준비하고 있어요</h3>
            <p>곧 찾아뵙겠습니다.</p>
          </div>
        </div>
      </section>
    </main>
    <!--@footer-->
    <script type="module" src="/src/pages/insights.js"></script>
  </body>
</html>
