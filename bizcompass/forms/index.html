<!doctype html>
<html lang="ko">
  <head>
    <!--@head title="서식" description="사업을 준비할 때 필요한 계약서와 서식을 확인하세요."-->
  </head>
  <body data-page="forms">
    <!--@header active="forms"-->
    <main id="main">
      <section class="page-hero">
        <div class="wrap page-hero-split">
          <div>
            <p class="eyebrow">서식 라이브러리</p>
            <h1>필요한 <span class="hl">문서</span>를 찾아보세요</h1>
            <p class="page-hero-lead">사업을 준비할 때 필요한 계약서와 서식을 확인하고 내려받으세요.</p>
          </div>
          <div class="count-badge" aria-live="polite">
            <strong id="form-shown"><!--@form-count--></strong>
            <span>종 서식</span>
          </div>
        </div>
      </section>

      <section class="section section--flush">
        <div class="wrap">
          <div class="toolbar">
            <label class="search">
              <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
              <span class="sr-only">서식 검색</span>
              <input type="search" id="form-search" placeholder="서식명 또는 키워드 검색" autocomplete="off" />
            </label>
            <p class="data-status" id="form-status" hidden></p>
          </div>
          <div class="chips" id="form-tabs" role="group" aria-label="서식 분류">
            <button type="button" class="chip" data-category="" aria-pressed="true">전체</button>
            <button type="button" class="chip" data-category="계약" aria-pressed="false">계약</button>
          </div>
          <div class="form-grid" id="form-grid" aria-busy="true"><!--@form-grid--></div>
          <div class="empty" id="form-empty" hidden>
            <h3 id="form-empty-title">조건에 맞는 서식이 없어요</h3>
            <p id="form-empty-text">검색어나 분류를 바꿔 다시 찾아보세요.</p>
          </div>
        </div>
      </section>
    </main>
    <!--@footer-->
    <script type="module" src="/src/pages/forms.js"></script>
  </body>
</html>
