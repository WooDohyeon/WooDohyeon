<!doctype html>
<html lang="ko">
  <head>
    <!--@head title="서식 보기" description="서식을 미리 보고 내려받으세요."-->
  </head>
  <body data-page="form-view">
    <!--@header active="forms"-->
    <main id="main">
      <section class="section section--flush form-view">
        <div class="wrap">
          <a class="back-link" href="{{base}}forms/">
            <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
            서식으로 돌아가기
          </a>

          <div class="form-view-head">
            <div>
              <p class="form-view-meta" id="form-meta">서식</p>
              <h1 id="form-title">서식을 불러오는 중입니다</h1>
              <p class="page-hero-lead" id="form-desc"></p>
            </div>
            <div class="download" id="form-downloads" aria-label="다운로드"></div>
          </div>

          <div class="viewer" id="form-viewer" aria-busy="true">
            <div class="viewer-state">
              <span class="spinner" aria-hidden="true"></span>
              <p>문서를 불러오고 있어요</p>
            </div>
          </div>
        </div>
      </section>
    </main>
    <!--@footer-->
    <script type="module" src="/src/pages/form-view.js"></script>
  </body>
</html>
